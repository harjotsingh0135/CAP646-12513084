<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!--- Semantic header Section -->
  <header>
    <h1>This is a Demo Student Portal</h1>
  </header>
  <nav>
    <a href="#home">Home</a>
    <a href="#register">Register</a>
    <a href="#contact">Contact</a>
  </nav>
  <!-- Semantic Main Section-->
  <main>
    <section id="home" >
      <h2>Home</h2>
        <p>This is the home section of the student portal.</p>
    </section>

    <section id="register">
      <h1>Register Form</h1>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" minlength="3"name="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>  
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}" required><br><br>
        <fieldset>
          <legend>Gender</legend>
          <input type="radio" id="male" name="gender" value="male" required>
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female" required>
          <label for="female">Female</label>
        </fieldset>

        <label>Choose Course</label>
        <select id="course" name="course" required>
          <option value="">Select a course</option>
          <option value="course1">Web Development</option>
          <option value="course2">Data Science</option>
          <option value="course3">AI/ML</option>
        </select>
      </form>
    </section>
    <section id="Media">
      <h2>Media</h2>
      <p>This is the media section of the student portal.</p>
  </main>
</body>
</html>
